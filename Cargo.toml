[package]
name = "tio-rs"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
license = "GPL-2.0-or-later"
description = "A comfortable serial terminal"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
crossterm = { version = "0.29", features = ["bracketed-paste"] }
ratatui = "0.30"
serialport = { version = "4", default-features = false }
vt100 = "0.18"

[dev-dependencies]
libc = "0.2"
